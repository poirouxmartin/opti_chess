name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: opti_chess
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset windows-release
      - run: cmake --build --preset windows-release
      # Non-regression gate (fast, deterministic; slow TIME benchmarks stay manual).
      # Debug/Perf excluded (diagnostics + micro-benchmarks); LichessBenchmark*/
      # CalibratedBatch/TestsTxtBatch/Progress ParamSweep are wall-clock heavy.
      - name: fast test suites
        run: ctest --test-dir opti_chess/build/windows-release --output-on-failure -E "Debug\.|Perf\.|LichessBenchmark|CalibratedBatch|TestsTxtBatch|TimeBudgetLadder|ScalingBenchmark|TimeBenchmark|GuiLikeBench|ParamSweep"
      # Puzzle gate: fixed nodes + seed => load-proof and solid (500 positions);
      # fails below threshold.
      - name: GATE-500 puzzle threshold
        shell: pwsh
        env:
          OPTI_PUZZLE_NODES: '2000'
          OPTI_SEED: '42'
          OPTI_PUZZLE_MAX: '500'
          OPTI_GATE_MIN_SOLVED: '400'
        run: >
          $out = & opti_chess/build/windows-release/Release/opti_chess_tests.exe
          --gtest_filter=Puzzle.LichessBenchmark5000 2>&1 | Out-String;
          echo $out; if ($out -match '\[500/500\] solved=(\d+)') {
          if ([int]$Matches[1] -lt [int]$env:OPTI_GATE_MIN_SOLVED) {
          Write-Error "GATE-500 regression: $($Matches[1]) < $env:OPTI_GATE_MIN_SOLVED"; exit 1 } }
          else { Write-Error 'GATE-500 output not recognized'; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: opti_chess-windows-x64
          path: opti_chess/build/windows-release/Release/
